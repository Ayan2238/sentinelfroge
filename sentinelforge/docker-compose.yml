# ─────────────────────────────────────────────────────────────────
# SentinelForge — Docker Compose
# ─────────────────────────────────────────────────────────────────
# Usage:
#   docker compose run --rm sf scan example.com --profile web
#   docker compose run --rm sf doctor
#   docker compose up neo4j     # start graph database
# ─────────────────────────────────────────────────────────────────

services:
  # ── SentinelForge scanner ───────────────────────────────────────
  sf:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sentinelforge:latest
    volumes:
      - ./output:/output
      - ./configs:/etc/sentinelforge:ro
    environment:
      - SF_LOG_LEVEL=${SF_LOG_LEVEL:-INFO}
      - SF_SHODAN_API_KEY=${SF_SHODAN_API_KEY:-}
      - SF_NEO4J_URI=${SF_NEO4J_URI:-bolt://neo4j:7687}
      - SF_NEO4J_USER=${SF_NEO4J_USER:-neo4j}
      # Set SF_NEO4J_PASSWORD only when the Neo4j integration is enabled.
      - SF_NEO4J_PASSWORD
      - SF_OUTPUT_DIR=/output
    networks:
      - sf-network

  # ── Neo4j attack graph database ─────────────────────────────────
  neo4j:
    image: neo4j:5.13
    profiles:
      - neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      # Set NEO4J_PASSWORD before starting the optional Neo4j profile.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sf-network

  # ── Report viewer (simple nginx) ────────────────────────────────
  report-viewer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./output/reports:/usr/share/nginx/html:ro
    profiles:
      - viewer
    networks:
      - sf-network

volumes:
  neo4j-data:
  neo4j-logs:

networks:
  sf-network:
    driver: bridge
