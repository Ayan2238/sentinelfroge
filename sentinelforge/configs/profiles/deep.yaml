# Deep scan profile — thorough, all modules at maximum depth
general:
  max_threads: 5
  timeout: 60

scanning:
  profile: deep
  max_depth: 5
  follow_redirects: true

plugins:
  enabled:
    - dns
    - http
    - ssl
    - web
    - osint
    - cloud
    - network

reporting:
  formats: [html, json, markdown, csv]
  include_evidence: true
  include_raw_requests: true
