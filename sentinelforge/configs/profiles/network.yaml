# Network scan profile — service and port-level assessment
general:
  max_threads: 20
  timeout: 15

scanning:
  profile: network
  max_depth: 1
  scope: cidr
  ports:
    mode: common
    ports: []
    ranges: []
    top: null
    max_workers: 100
    timeout: 2

plugins:
  enabled:
    - dns
    - network
    - ssl
  disabled:
    - web
    - osint
    - cloud
    - http
